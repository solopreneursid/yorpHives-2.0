name: Preview smoke tests

on:
  push:
    branches: ["build/trust-commerce-foundation"]

permissions:
  contents: read

concurrency:
  group: yorphives-preview-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      YH_BASE_URL: https://build-trust-commerce-foundat.yorphives-2-preview.pages.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for preview API
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent "$YH_BASE_URL/api/v1/health" | grep -q '"database":"ok"'; then
              exit 0
            fi
            sleep 10
          done
          echo "Preview did not become healthy in 5 minutes"
          exit 1
      - name: Exercise deployed HTTP, MCP, identity and CORS contracts
        run: npm run smoke
