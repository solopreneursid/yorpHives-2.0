name: Public website HTTP evidence — no credentials

on:
  pull_request:
    branches:
      - fix/headquarters-repair-intake-learning
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-http-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Collect real, read-only YorpHives route evidence
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check out exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288ca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Inspect public routes without accounts, AI, or writes
        run: node scripts/website-public-evidence.mjs
      - name: Upload bounded public response evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: website-public-proof-${{ github.run_id }}
          path: artifacts/website-public-proof/
          if-no-files-found: warn
          retention-days: 14
