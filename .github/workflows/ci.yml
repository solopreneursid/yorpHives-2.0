name: YorpHives CI

on:
  push:
    branches: ["main", "build/**"]
  pull_request:
    branches: ["main", "build/**"]

permissions:
  contents: read

concurrency:
  group: yorphives-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check Worker JavaScript syntax
        run: find functions scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - name: Validate D1 migrations
        run: |
          python - <<'PY'
          import glob, sqlite3
          db = sqlite3.connect(':memory:')
          paths = sorted(glob.glob("migrations/*.sql"))
          for path in paths:
              with open(path, encoding="utf-8") as migration:
                  db.executescript(migration.read())
          expected = {"principals", "api_keys", "capability_grants", "usage_ledger", "credits_ledger", "orders", "payment_events", "audit_events"}
          actual = {row[0] for row in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          missing = expected - actual
          if missing:
              raise SystemExit(f"Missing tables: {sorted(missing)}")
          print(f"Validated {len(paths)} migrations and {len(expected)} core tables")
          PY
      - name: Run tests
        run: npm test
      - name: Build static assets
        run: npm run build
