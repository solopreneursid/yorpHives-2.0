name: YorpHives CI

on:
  push:
    branches: ["main", "build/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: yorphives-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Build static assets
        run: npm run build
