name: YorpHives platform checks

on:
  push:
    branches:
      - main
      - "build/**"
      - "agent/**"
      - "repair/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: platform-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run syntax checks and platform contract tests
        run: npm run check
