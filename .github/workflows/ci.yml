name: YorpHives platform checks

on:
  push:
    branches:
      - main
      - "build/**"
  pull_request:
    branches:
      - main
      - build/headquarters-staging-mission-proof
      - build/headquarters-durable-staging-rehearsal
      - build/headquarters-shared-repair-learning
      - build/headquarters-founder-temporary-permissions
      - design/headquarters-compact-workspace
      - design/headquarters-prism-brand-theme
      - ops/headquarters-staging-schema-complete
      - qa/headquarters-browser-launch-check
      - fix/headquarters-repair-intake-learning

permissions:
  contents: read

concurrency:
  group: platform-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository with history for cumulative review
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run syntax checks and platform contract tests
        run: npm run check
      - name: Verify Headquarters component, migration and provider policy
        run: npm run check:headquarters-readiness
      - name: Inventory full Headquarters release lineage against main
        run: npm run audit:headquarters-lineage
      - name: Upload Headquarters preproduction audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: headquarters-preproduction-${{ github.run_id }}
          path: artifacts/headquarters-readiness/
          if-no-files-found: warn
          retention-days: 14
