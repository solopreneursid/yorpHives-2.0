name: YorpHives browser, SEO and performance quality

on:
  push:
    branches: [main, "build/**"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 2 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    if: github.event_name != 'pull_request'
    name: Deploy isolated Cloudflare Pages preview
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.preview.outputs.url }}
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: 69234e51e08d8013980a7ff869746609
      PAGES_PROJECT_NAME: yorphives-2-preview
      PAGES_BRANCH: ${{ github.head_ref || github.ref_name }}
      PAGES_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PAGES_COMMIT_MESSAGE: ${{ github.event.pull_request.title || github.event.head_commit.message || github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Deploy the feature branch to the preview project
        id: preview
        if: github.event_name == 'pull_request' || github.ref_name != 'main'
        run: npm run deploy:pages-preview
      - name: Use the public production site for main-branch audits
        if: github.event_name != 'pull_request' && github.ref_name == 'main'
        run: echo "url=https://yorphives.com" >> "$GITHUB_OUTPUT"

  browser-and-seo:
    if: github.event_name != 'pull_request'
    needs: deploy-preview
    env:
      SITE_BASE_URL: ${{ needs.deploy-preview.outputs.url }}
    name: Browser smoke tests and SEO crawl
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Wait for the exact isolated Pages deployment
        run: |
          TARGET_URL="$SITE_BASE_URL"
          if [ -z "$TARGET_URL" ]; then
            echo "::error::Preview deployment job did not return a target URL."
            exit 1
          fi
          echo "Waiting for Pages deployment: $TARGET_URL"
          for attempt in $(seq 1 30); do
            STATUS="$(curl -sS -L -o /dev/null -w '%{http_code}' --max-time 15 "$TARGET_URL/" || true)"
            if [ "$STATUS" = "200" ]; then
              echo "Pages deployment is serving HTTP 200."
              exit 0
            fi
            echo "Preview not ready yet (HTTP $STATUS), attempt $attempt/30."
            sleep 10
          done
          echo "The isolated Pages deployment did not become ready within five minutes."
          exit 1
      - name: Install browser test runtime
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run real-browser and SEO checks against the branch preview
        run: node scripts/site-quality.mjs
      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yorphives-site-quality-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30

  code-review:
    name: Code review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Run automated change-risk review
        run: node scripts/agent-review.mjs
      - name: Upload code-review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yorphives-code-review-${{ github.run_id }}
          path: artifacts/agent-review/
          if-no-files-found: warn
          retention-days: 30

  lighthouse:
    if: github.event_name != 'pull_request'
    needs: deploy-preview
    env:
      SITE_BASE_URL: ${{ needs.deploy-preview.outputs.url }}
    name: Lighthouse performance audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Wait for the exact isolated Pages deployment
        run: |
          TARGET_URL="$SITE_BASE_URL"
          if [ -z "$TARGET_URL" ]; then
            echo "::error::Preview deployment job did not return a target URL."
            exit 1
          fi
          echo "Waiting for Pages deployment: $TARGET_URL"
          for attempt in $(seq 1 30); do
            STATUS="$(curl -sS -L -o /dev/null -w '%{http_code}' --max-time 15 "$TARGET_URL/" || true)"
            if [ "$STATUS" = "200" ]; then
              echo "Pages deployment is serving HTTP 200."
              exit 0
            fi
            echo "Preview not ready yet (HTTP $STATUS), attempt $attempt/30."
            sleep 10
          done
          echo "The isolated Pages deployment did not become ready within five minutes."
          exit 1
      - name: Install Lighthouse and Chromium
        run: |
          npm install --no-save --no-package-lock lighthouse@12.8.2
          npx --yes playwright@1.56.1 install --with-deps chromium
      - name: Run Lighthouse on key branch-preview pages
        run: |
          mkdir -p artifacts/lighthouse
          CHROME_BIN="$(find "$HOME/.cache/ms-playwright" -type f -name chrome -o -name chromium | head -n 1)"
          npx lighthouse "$SITE_BASE_URL/" --chrome-path="$CHROME_BIN" --output=json --output-path=artifacts/lighthouse/home.json --only-categories=performance,accessibility,best-practices,seo --chrome-flags="--headless --no-sandbox"
          npx lighthouse "$SITE_BASE_URL/free-tools/" --chrome-path="$CHROME_BIN" --output=json --output-path=artifacts/lighthouse/free-tools.json --only-categories=performance,accessibility,best-practices,seo --chrome-flags="--headless --no-sandbox"
      - name: Summarize Lighthouse scores
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const files = ['artifacts/lighthouse/home.json','artifacts/lighthouse/free-tools.json'];
          const rows = [];
          for (const file of files) {
            const report = JSON.parse(await readFile(file,'utf8'));
            const scores = Object.fromEntries(Object.entries(report.categories).map(([key,value]) => [key, Math.round(value.score * 100)]));
            rows.push({ page: report.finalDisplayedUrl, ...scores });
          }
          console.table(rows);
          await writeFile('artifacts/lighthouse/summary.json', JSON.stringify(rows,null,2));
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: yorphives-lighthouse-${{ github.run_id }}
          path: artifacts/lighthouse/
          if-no-files-found: warn
          retention-days: 30
