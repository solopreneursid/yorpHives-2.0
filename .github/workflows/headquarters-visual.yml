name: Headquarters offline desktop and mobile visual QA

on:
  pull_request:
    branches:
      - ops/headquarters-staging-schema-complete
      - fix/headquarters-repair-intake-learning
      - fix/headquarters-live-website-proof
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: headquarters-offline-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    name: Screenshot and safe interaction tests (no live API)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact tested source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install pinned temporary browser test runner
        run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
      - name: Install isolated Chromium browser and OS dependencies
        run: npx playwright install --with-deps chromium
      - name: Render and verify Headquarters with fully synthetic data
        run: node scripts/headquarters-offline-visual.mjs
      - name: Upload non-sensitive screenshots and check summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: headquarters-offline-visual-${{ github.run_id }}
          path: artifacts/headquarters-visual/
          if-no-files-found: warn
          retention-days: 14
