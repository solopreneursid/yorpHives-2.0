name: YorpHives dependency, secret and passive security checks

on:
  push:
    branches: [main, "build/**"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 3"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Repository secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository for exposed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Dependency and action supply-chain review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
      - name: Validate package manifest
        run: node -e "const p=require('./package.json'); if(!p.private) process.exit(1); console.log('Package manifest parsed; runtime dependencies are browser/CDN based and no npm lockfile is present.')"

  browser-library-audit:
    name: Browser library vulnerability inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install current Retire.js scanner
        run: npm install --no-save --no-package-lock retire
      - name: Scan bundled and CDN-referenced browser libraries
        run: |
          mkdir -p artifacts
          npx retire --path . --outputformat json --outputpath artifacts/retirejs.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yorphives-retirejs-${{ github.run_id }}
          path: artifacts/retirejs.json
          if-no-files-found: warn
          retention-days: 30

  zap-passive-baseline:
    name: OWASP ZAP passive baseline (production)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Passive baseline scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: https://yorphives.com/
          cmd_options: "-m 2 -T 10 -I"
