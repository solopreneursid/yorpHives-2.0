name: YorpHives authenticated Admin staging smoke tests

on:
  # Secret-bearing Pages deployments are founder-initiated only. The separate
  # credential-free Chromium workflow runs automatically on pull requests.
  workflow_dispatch:
    inputs:
      reviewed_commit_sha:
        description: "Exact 40-character Git commit you reviewed for private staging"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: admin-staging-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authenticated-admin-smoke:
    name: Authenticated Admin browser smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging-deployments
    env:
      CF_ACCOUNT_ID: 69234e51e08d8013980a7ff869746609
      PAGES_PROJECT_NAME: yorphives-admin-staging
      PAGES_BRANCH: ${{ github.head_ref || github.ref_name }}
      PAGES_COMMIT_SHA: ${{ inputs.reviewed_commit_sha }}
      PAGES_COMMIT_MESSAGE: Verified owner-selected staging browser QA
    steps:
      - name: Check out the tested branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Verify exact founder-reviewed staging revision
        env:
          REVIEWED_SHA: ${{ inputs.reviewed_commit_sha }}
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$REVIEWED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Enter the complete, exact 40-character reviewed commit SHA."
            exit 1
          fi
          if [ "$REVIEWED_SHA" != "$EXPECTED_SHA" ] || [ "$REVIEWED_SHA" != "$(git rev-parse HEAD)" ]; then
            echo "::error::The selected branch commit does not match the approved SHA. No staging deployment will start."
            exit 1
          fi
          if [ "$PAGES_BRANCH" = "main" ]; then
            echo "::error::A production branch is not a private feature preview."
            exit 1
          fi
          echo "Exact staging preview revision verified."
      - name: Verify required deployment and Access credentials
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        shell: bash
        run: |
          if [ -z "$CF_API_TOKEN" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN as an environment secret in the protected staging-deployments environment with account-scoped Cloudflare Pages Edit permission."
            exit 1
          fi
          if [ -z "$CF_ACCESS_CLIENT_ID" ] || [ -z "$CF_ACCESS_CLIENT_SECRET" ]; then
            echo "::error::Add CF_ACCESS_CLIENT_ID and CF_ACCESS_CLIENT_SECRET as environment secrets in staging-deployments, then authorize the token with a Service Auth policy on the YorpHives Admin deployment aliases Access application."
            exit 1
          fi
      - name: Deploy the Admin feature branch to isolated Pages staging
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy:pages-preview
      - name: Wait for authenticated Admin preview
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        shell: bash
        run: |
          if [ -z "$ADMIN_BASE_URL" ]; then
            echo "::error::The Pages deployment step did not return ADMIN_BASE_URL."
            exit 1
          fi
          echo "Waiting for authenticated Admin preview: $ADMIN_BASE_URL"
          for attempt in $(seq 1 30); do
            STATUS="$(curl -sS -L -o /dev/null -w '%{http_code}' --max-time 15 \
              -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
              -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
              "$ADMIN_BASE_URL/admin/" || true)"
            if [ "$STATUS" = "200" ]; then
              echo "Authenticated Admin preview is serving HTTP 200."
              exit 0
            fi
            echo "Admin preview not ready (HTTP $STATUS), attempt $attempt/30."
            sleep 10
          done
          echo "::error::Authenticated Admin preview did not become ready."
          exit 1
      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run read-only authenticated Admin browser tests
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: npm run test:admin-smoke
      - name: Upload sanitized Admin smoke report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yorphives-admin-smoke-${{ github.run_id }}
          path: artifacts/admin-smoke.json
          if-no-files-found: warn
          retention-days: 30
