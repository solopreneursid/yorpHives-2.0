name: YorpHives authenticated Admin staging smoke tests

on:
  # Development QA does NOT require founder approval.
  # This is a manually dispatchable, read-only staging verifier until a trusted
  # automated dispatch identity is configured. Headquarters never handles Go Live.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-staging-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authenticated-admin-smoke:
    name: Authenticated Admin browser smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging-deployments
    env:
      CF_ACCOUNT_ID: 69234e51e08d8013980a7ff869746609
      PAGES_PROJECT_NAME: yorphives-admin-staging
      PAGES_BRANCH: ${{ github.head_ref || github.ref_name }}
      PAGES_COMMIT_SHA: ${{ github.sha }}
      PAGES_COMMIT_MESSAGE: Verified owner-selected staging browser QA
    steps:
      - name: Check out the tested branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Verify isolated staging revision without founder approval
        env:
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || [ "$EXPECTED_SHA" != "$(git rev-parse HEAD)" ]; then
            echo "::error::The checked-out revision does not match the exact GitHub commit."
            exit 1
          fi
          if ! [[ "$PAGES_BRANCH" =~ ^(build|feature|fix|qa|design|ops)/[a-z0-9._/-]+$ ]] ||
             [ "$PAGES_BRANCH" = "main" ] || [ "$PAGES_BRANCH" = "master" ]; then
            echo "::error::Only isolated development branches can be tested here."
            exit 1
          fi
          echo "Development QA authorized by the staging workflow policy; no founder approval needed."
      - name: Verify required deployment and Access credentials
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        shell: bash
        run: |
          if [ -z "$CF_API_TOKEN" ]; then
            echo "::error::A protected CLOUDFLARE_API_TOKEN with Cloudflare Pages Read is needed to check the exact existing private deployment."
            exit 1
          fi
          if [ -z "$CF_ACCESS_CLIENT_ID" ] || [ -z "$CF_ACCESS_CLIENT_SECRET" ]; then
            echo "::error::Add CF_ACCESS_CLIENT_ID and CF_ACCESS_CLIENT_SECRET as environment secrets in staging-deployments, then authorize the token with a Service Auth policy on the YorpHives Admin deployment aliases Access application."
            exit 1
          fi
      - name: Verify the existing private Pages preview and anonymous Access boundary
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/verify-existing-admin-preview.mjs
      - name: Wait for authenticated Admin preview
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        shell: bash
        run: |
          if [ -z "$ADMIN_BASE_URL" ]; then
            echo "::error::The verified existing preview did not return ADMIN_BASE_URL."
            exit 1
          fi
          echo "Waiting for authenticated Admin preview: $ADMIN_BASE_URL"
          for attempt in $(seq 1 30); do
            STATUS="$(curl -sS -L -o /dev/null -w '%{http_code}' --max-time 15 \
              -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
              -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
              "$ADMIN_BASE_URL/admin/" || true)"
            if [ "$STATUS" = "200" ]; then
              echo "Authenticated Admin preview is serving HTTP 200."
              exit 0
            fi
            echo "Admin preview not ready (HTTP $STATUS), attempt $attempt/30."
            sleep 10
          done
          echo "::error::Authenticated Admin preview did not become ready."
          exit 1
      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run read-only authenticated Admin browser tests
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: npm run test:admin-smoke
      - name: Upload sanitized Admin smoke report and safe existing-preview receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yorphives-admin-smoke-${{ github.run_id }}
          path: |
            artifacts/admin-smoke.json
            artifacts/admin-preview-verification.json
          if-no-files-found: warn
          retention-days: 30

  independent-monitoring-qa:
    # Only verified signed-in staging evidence, checked by an unprivileged QA job.
    name: Independent monitoring QA
    needs: authenticated-admin-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out exact tested source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Download authenticated browser and Access receipts
        uses: actions/download-artifact@v4
        with:
          name: yorphives-admin-smoke-${{ github.run_id }}
          path: artifacts/
      - name: Validate independent QA evidence for the exact commit
        env:
          RELEASE_EXPECTED_SHA: ${{ github.sha }}
        run: node scripts/release-qa-attestation.mjs artifacts/admin-preview-verification.json artifacts/admin-smoke.json
